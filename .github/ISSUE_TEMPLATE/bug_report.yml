name: Reporte de error (Bug)
description: Cuéntanos si algo falló en la vista 3D, salas 2D, Taller Interno o Firebase.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por ayudar a cuidar **MUSEO 404**. Por favor danos detalles claros para poder reproducir el problema.
  - type: textarea
    id: description
    attributes:
      label: ¿Qué pasó?
      description: Describe de forma clara el error y en qué pantalla estabas (3D, Mapa 2D, Sala 2D, Editor, Directorio, Libro de visitas...).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Ir a '...'
        2. Hacer clic en '...'
        3. Observar el error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: ¿Qué esperabas que pasara?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Navegador y dispositivo
      placeholder: "Ej. Chrome en macOS, Safari en iPhone..."
